<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#080a0d"><title>JBCO · After Hours</title><link rel="stylesheet" href="./style.css?v=2"></head><body><main class="arena-shell"><canvas id="court" aria-label="실사풍 선수들이 움직이는 농구 코트"></canvas><div class="vignette"></div><header><a href="./" class="wordmark">JBCO<span>AFTER HOURS</span></a><div class="top-actions"><span class="live"><i></i> OPEN PRACTICE</span><button id="menu" aria-controls="desk" aria-expanded="false">업무 <span id="task-count">0</span> ☰</button></div></header><div class="scene-caption"><span>PRIVATE COURT / 001</span><p>Just let them play.</p></div><footer><div id="roster"></div><div class="playback"><button id="motion" aria-pressed="false" aria-label="애니메이션 일시정지">Ⅱ</button><button id="fullscreen" aria-label="전체 화면">⛶</button></div></footer><div class="hint" id="hint">선수를 선택해 업무를 배정하세요 · 실제 AI 미연결</div><aside id="desk" hidden><div class="desk-header"><div><small>FRONT OFFICE</small><h1>업무</h1></div><button id="close-desk" aria-label="업무 닫기">×</button></div><p class="notice">현재는 로컬 업무 보드입니다. AI 실행은 연결되지 않았습니다.</p><button id="new-play" class="primary">＋ 업무 배정</button><div class="tabs"><button data-filter="all" class="active">전체</button><button data-filter="active">진행 중</button><button data-filter="done">완료</button></div><div id="tasks"></div><div class="storage-note">이 브라우저에만 저장됩니다.</div></aside><dialog id="assignment"><form id="task-form"><small>NEW ASSIGNMENT</small><h2>다음 플레이.</h2><label>담당<select id="agent"><option value="gpt">GPT · 기획 / THE BEARD</option><option value="claude">Claude · 개발 / THE KING</option><option value="gemini">Gemini · 리서치 / THE SLIM</option><option value="muse">Muse · 영상 관리</option><option value="copilot">Copilot · 코딩 보조</option></select></label><label>업무<textarea id="brief" required maxlength="500" placeholder="무엇을 맡길까요?"></textarea></label><p>실제 AI에 전송되지 않고 업무 보드에 저장됩니다.</p><div class="dialog-actions"><button type="button" id="cancel">취소</button><button type="submit" class="primary">배정하기 ↗</button></div></form></dialog><div id="toast" role="status"></div><div id="loading">LIGHTS ON.<span>코트를 준비하고 있어요</span></div></main><script type="module" src="./app.js?v=2"></script></body></html>
