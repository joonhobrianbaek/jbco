<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f5efe5"><title>BB Office · 직원 옷장</title><link rel="icon" href="./brand.png"><link rel="stylesheet" href="./wardrobe.css?v=2"></head><body class="wardrobe-page"><main><header><a class="brand" href="./" aria-label="오피스로 돌아가기"><img src="./brand.png" alt="BB" width="28" height="28"></a><div class="display-actions"><select id="display-layout" aria-label="모니터 배치"><option value="left">왼쪽 모니터</option><option value="standard">기본 배치</option></select><a href="./">오피스로 돌아가기 ↗</a></div></header><section class="intro"><div><span>THE TEAM CLOSET</span><h1>오늘은 뭐 입지?</h1><p>직원마다 룩을 골라봐. 옷장 선택은 이 브라우저에 저장돼. 왼쪽 모니터에서는 주력 직원을 오른쪽에 모아줘.</p></div><button id="reset" type="button">처음 스타일로</button></section><div id="closet" aria-label="직원별 옷장"></div><p id="save-status" role="status"></p><footer><p>피규어 디자인을 고르는 2D 옷장이야. 실제 사무실의 3D 모델에는 아직 적용되지 않아.</p><a href="./concepts/staff-street.png" target="_blank" rel="noopener">스트리트 전체 시안 ↗</a><a href="./concepts/staff-afterhours.png" target="_blank" rel="noopener">애프터아워 룩 전체 시안 ↗</a><a href="./concepts/staff-clay.png" target="_blank" rel="noopener">기존 시안 보기 ↗</a></footer></main><script type="module" src="./wardrobe.js?v=2"></script><script type="module" src="./display-layout.js?v=1"></script></body></html>
